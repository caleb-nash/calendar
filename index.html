<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">&#10022;</span> Calendar</div>
    </header>

    <main class="calendar-wrap">
      <section class="calendar-card" aria-label="Calendar">
        <div class="cal-header">
          <button class="nav-btn" id="prevBtn" aria-label="Previous month" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="month-title-wrap">
            <h1 id="monthTitle">Month Year</h1>
            <button class="today-pill" id="todayBtn" type="button">Today</button>
          </div>

          <button class="nav-btn" id="nextBtn" aria-label="Next month" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="weekdays" id="weekdaysRow"></div>
        <div class="days-grid" id="daysGrid"></div>
      </section>
    </main>

    <div class="panel-backdrop" id="panelBackdrop"></div>

    <aside class="day-panel" id="dayPanel" aria-hidden="true">
      <div class="day-panel-inner">
        <div class="day-panel-header">
          <div>
            <div class="day-panel-weekday" id="panelWeekday">Monday</div>
            <div class="day-panel-date" id="panelDate">July 27, 2026</div>
          </div>
          <button class="close-btn" id="closePanelBtn" aria-label="Close" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <ul class="event-list" id="eventList"></ul>
        <p class="empty-state" id="emptyState">No events yet. Add the first one below.</p>

        <form class="add-event-form" id="addEventForm">
          <input type="time" id="eventTime" class="time-input" />
          <input type="text" id="eventText" class="text-input" placeholder="Add an event or note&hellip;" maxlength="120" autocomplete="off" />
          <button type="submit" class="add-btn" aria-label="Add event">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
